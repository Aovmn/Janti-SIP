<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPETRA Janti - Full Screen WebGIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #fbf8f3;
      --surface: #ffffff;
      --text: #231c17;
      --muted: #6b5a4e;
      --line: rgba(46,36,29,.08);
      --primary: #8b5e3c;
      --primary-deep: #4c2f1d;
      --shadow: 0 8px 30px rgba(0,0,0,0.06);
      --radius: 16px;
      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-display: 'Cormorant Garamond', Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: var(--font-body); color: var(--text); background: var(--bg); overflow: hidden; }
    
    /* Full Screen Layout */
    .app-container { display: flex; flex-direction: column; width: 100%; height: 100vh; }
    
    .nav { 
      height: 70px; background: #ffffff; border-bottom: 1px solid var(--line); 
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 1000;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; text-decoration: none; color: inherit; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, #6f4a2f, #8b5e3c);
    }
    .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }

    .main-layout { display: flex; flex: 1; height: calc(100vh - 70px); width: 100%; position: relative; }
    
    /* Sidebar */
    .sidebar { 
      width: 340px; height: 100%; background: #ffffff; border-right: 1px solid var(--line); 
      display: flex; flex-direction: column; z-index: 999; box-shadow: 4px 0 20px rgba(0,0,0,0.02);
    }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--line); }
    .sidebar-header h2 { font-family: var(--font-display); font-size: 24px; color: var(--primary-deep); }
    .sidebar-header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    
    .sidebar-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .sidebar-section h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 10px; }
    .sidebar-group { display: flex; flex-direction: column; gap: 8px; }
    
    .control { 
      display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; 
      background: #fdfbf7; border: 1px solid var(--line); font-size: 13.5px; cursor: pointer; transition: all 0.2s;
    }
    .control:hover { background: #f7f2ea; border-color: rgba(46,36,29,0.2); }
    .control input { cursor: pointer; }

    /* Legend Box */
    .legend-box { padding: 14px; border-radius: 12px; background: #faf8f5; border: 1px solid var(--line); }
    .legend-label { font-weight: 700; font-size: 13px; margin-bottom: 10px; color: var(--primary-deep); }
    .legend-item { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
    .legend-item:last-child { margin-bottom: 0; }
    .swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0; }

    /* Map Space */
    #map { flex: 1; height: 100%; width: 100%; background: #eee; }

    /* Custom Popup Styles */
    .custom-popup .leaflet-popup-content-wrapper { border-radius: 16px; background: #fffaf4; border: 1px solid rgba(197,154,74,0.3); padding: 0; overflow: hidden; width: 290px; box-shadow: var(--shadow); }
    .custom-popup .leaflet-popup-tip { background: #fffaf4; }
    .leaflet-popup-content { margin: 0 !important; width: 100% !important; font-family: var(--font-body); }
    .popup-card { padding: 16px; }
    .popup-title { font-weight: 700; font-size: 15px; color: var(--primary-deep); font-family: var(--font-display); margin-bottom: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
    .popup-section { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(46,36,29,0.1); }
    .popup-section:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
    .popup-section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .popup-row { display: grid; grid-template-columns: 100px 1fr; gap: 8px; padding: 4px 0; }
    .popup-key { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .popup-value { font-size: 13px; font-weight: 600; color: var(--text); }

    @media (max-width: 768px) {
      .main-layout { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 300px; }
      #map { height: calc(100% - 300px); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <nav class="nav">
      <a href="#" class="brand">
        <span class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2Z" fill="currentColor"/><circle cx="12" cy="9" r="2.5" fill="#fff"/></svg>
        </span>
        <div>SIPETRA Janti<small>Sistem Informasi Pertanahan Desa</small></div>
      </a>
    </nav>

    <div class="main-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Peta Interaktif Desa</h2>
          <p>Klik pada area bidang peta untuk memunculkan ringkasan info pertanahan secara lengkap.</p>
        </div>
        <div class="sidebar-content">
          <div class="sidebar-section">
            <h3>Basemap</h3>
            <div class="sidebar-group">
              <label class="control"><input type="radio" name="basemap" id="osmBase" checked> OpenStreetMap</label>
              <label class="control"><input type="radio" name="basemap" id="satelliteBase"> Citra Satelit</label>
            </div>
          </div>
          <div class="sidebar-section">
            <h3>Layer Data</h3>
            <div class="sidebar-group">
              <label class="control"><input type="checkbox" id="admLayerToggle" checked> Batas Administrasi Desa</label>
              <label class="control"><input type="checkbox" id="wmsLayerToggle" checked> Penggunaan Lahan</label>
              <label class="control"><input type="checkbox" id="tanahLayerToggle" checked> Status Hak Tanah</label>
            </div>
          </div>
          <div class="sidebar-section">
            <h3>Legenda</h3>
            <div class="legend-box">
              <div class="legend-label">Status Hak</div>
              <div class="legend-item"><span class="swatch" style="background:#FFD043"></span> Hak Milik</div>
              <div class="legend-item"><span class="swatch" style="background:#99FF33"></span> Hak Pakai</div>
              <div class="legend-item"><span class="swatch" style="background:#A16B55"></span> Hak Wakaf</div>
              <div class="legend-item"><span class="swatch" style="background:#D4CFC7"></span> Kosong / Tidak Ada Data</div>
            </div>
          </div>
        </div>
      </aside>

      <main id="map"></main>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-7.694, 110.615], 16);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);
    const satelliteBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });

    let admLayer, penggunaanLahanLayer, statusHakLayer;
    let penggunaanFeatures = [], statusFeatures = [], zntFeatures = [], admFeatures = [];

    // Pemetaan warna cerah baru
    function getPenggunaanColor(kat) {
      if (kat.includes('sawah')) return '#73E600';
      if (kat.includes('bangunan') || kat.includes('hunian')) return '#FF5500';
      if (kat.includes('pekarangan')) return '#FFAA00';
      if (kat.includes('jalan')) return '#E1E1E1';
      if (kat.includes('sungai') || kat.includes('kolam')) return '#00C5FF';
      if (kat.includes('masjid') || kat.includes('gereja')) return '#E600A9';
      return '#C2B2A2';
    }

    function getStatusColor(st) {
      if (st.includes('milik')) return '#FFD043'; // Kuning Cerah
      if (st.includes('pakai')) return '#99FF33'; // Hijau Cerah
      if (st.includes('wakaf')) return '#A16B55'; // Cokelat Muda
      return '#D4CFC7';
    }

    // Fungsi deteksi spasial data di background (ZNT diload tapi tidak digambar di peta)
    function findFeatureAtLatLng(latlng, features) {
      for (const f of features) {
        try {
          const layer = L.geoJSON(f);
          if (layer.getBounds().contains(latlng)) return f.properties;
        } catch(e){}
      }
      return null;
    }

    function buildUnifiedPopup(latlng, clickedProps) {
      const pLahan = findFeatureAtLatLng(latlng, penggunaanFeatures) || {};
      const pStatus = findFeatureAtLatLng(latlng, statusFeatures) || {};
      const pZNT = findFeatureAtLatLng(latlng, zntFeatures) || {};
      const pAdm = findFeatureAtLatLng(latlng, admFeatures) || {};

      const desa = pAdm.NAMOBJ || pAdm.DESA || clickedProps.DESA || 'Janti';
      const lahanVal = clickedProps.V4_JB || clickedProps.penggunaan || pLahan.V4_JB || pLahan.penggunaan || '–';
      const statusVal = clickedProps.tipe_hak || clickedProps.status || pStatus.tipe_hak || pStatus.status || '–';
      
      // Ambil data ZNT walaupun layernya tidak terlihat di peta
      const zntVal = pZNT.ZNT || pZNT.znt || clickedProps.ZNT || '–';
      const nilaiVal = pZNT.nilai_tanah || pZNT.NJOP || clickedProps.nilai_tanah || null;

      return `
        <div class="popup-card">
          <div class="popup-title">Detail Bidang Tanah</div>
          <div class="popup-section">
            <div class="popup-section-title">📍 Lokasi</div>
            <div class="popup-row"><div class="popup-key">Desa</div><div class="popup-value">${desa}</div></div>
          </div>
          <div class="popup-section">
            <div class="popup-section-title">🌾 Penggunaan & Hak</div>
            <div class="popup-row"><div class="popup-key">Pemanfaatan</div><div class="popup-value">${lahanVal}</div></div>
            <div class="popup-row"><div class="popup-key">Status Hak</div><div class="popup-value">${statusVal}</div></div>
          </div>
          <div class="popup-section">
            <div class="popup-section-title">🏷️ Info Nilai (ZNT)</div>
            <div class="popup-row"><div class="popup-key">Kode Zona</div><div class="popup-value">${zntVal}</div></div>
            ${nilaiVal ? `<div class="popup-row"><div class="popup-key">Estimasi</div><div class="popup-value">Rp ${Number(nilaiVal).toLocaleString('id-ID')}/m²</div></div>` : ''}
          </div>
        </div>`;
    }

    function setupClick(feature, layer) {
      layer.on('click', function(e) {
        L.DomEvent.stopPropagation(e);
        const content = buildUnifiedPopup(e.latlng, feature.properties || {});
        L.popup({ className: 'custom-popup', maxWidth: 300 }).setLatLng(e.latlng).setContent(content).openOn(map);
      });
    }

    // Sinkronisasi data AJAX
    Promise.all([
      fetch('./Batas Administrasi.geojson').then(r => r.json()),
      fetch('./Penggunaan Lahan.geojson').then(r => r.json()),
      fetch('./Status Hak.geojson').then(r => r.json()),
      fetch('./ZNT.geojson').then(r => r.json()).catch(() => ({ features: [] }))
    ])
    .then(([adminData, penggunaanData, statusData, zntData]) => {
      admFeatures = adminData.features || [];
      penggunaanFeatures = penggunaanData.features || [];
      statusFeatures = statusData.features || [];
      zntFeatures = zntData.features || []; // Data disimpan di memory, tidak dimasukkan ke map layer!

      // Layer 1: Batas Administrasi (Garis Luar Saja)
      admLayer = L.geoJSON(adminData, {
        style: { color: '#a83232', weight: 3, fillOpacity: 0, dashArray: '6, 4' },
        onEachFeature: setupClick
      }).addTo(map);

      // Layer 2: Penggunaan Lahan (Warna Cerah, Opacity Tinggi)
      penggunaanLahanLayer = L.geoJSON(penggunaanData, {
        style: (f) => {
          const kat = (f.properties.V4_JB || f.properties.penggunaan || '').toLowerCase();
          return { color: '#ffffff', weight: 0.5, fillColor: getPenggunaanColor(kat), fillOpacity: 0.85 };
        },
        onEachFeature: setupClick
      }).addTo(map);

      // Layer 3: Status Hak
      statusHakLayer = L.geoJSON(statusData, {
        style: (f) => {
          const st = (f.properties.tipe_hak || f.properties.status || '').toLowerCase();
          return { color: '#ffffff', weight: 0.8, fillColor: getStatusColor(st), fillOpacity: 0.80 };
        },
        onEachFeature: setupClick
      }).addTo(map);

      // Otomatis zoom ke objek desa
      const group = L.featureGroup([penggunaanLahanLayer, statusHakLayer].filter(l => l !== undefined));
      if (group.getLayers().length > 0) map.fitBounds(group.getBounds());
    })
    .catch(err => console.error("Gagal memuat file spasial:", err));

    // Kontrol UI Sidebar Switcher
    document.getElementById('admLayerToggle').addEventListener('change', function() { if(admLayer) this.checked ? map.addLayer(admLayer) : map.removeLayer(admLayer); });
    document.getElementById('wmsLayerToggle').addEventListener('change', function() { if(penggunaanLahanLayer) this.checked ? map.addLayer(penggunaanLahanLayer) : map.removeLayer(penggunaanLahanLayer); });
    document.getElementById('tanahLayerToggle').addEventListener('change', function() { if(statusHakLayer) this.checked ? map.addLayer(statusHakLayer) : map.removeLayer(statusHakLayer); });
    
    document.getElementById('osmBase').addEventListener('change', function() { if(this.checked) { map.removeLayer(satelliteBase); map.addLayer(osmBase); } });
    document.getElementById('satelliteBase').addEventListener('change', function() { if(this.checked) { map.removeLayer(osmBase); map.addLayer(satelliteBase); } });
    
    window.addEventListener('load', () => { if (window.lucide) lucide.createIcons(); });
  </script>
</body>
</html>

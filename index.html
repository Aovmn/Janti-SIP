<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPETRA Janti</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }
    .header {
      background: #0f766e;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .header p { margin: 0; }
    .controls {
      background: white;
      padding: 16px 20px;
      border-bottom: 1px solid #ddd;
    }
    .controls h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 10px;
    }
    .control-group label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      background: #f8fafc;
      padding: 8px 12px;
      border: 1px solid #dbe3ea;
      border-radius: 8px;
    }
    #map {
      width: 100%;
      height: 80vh;
    }
    .leaflet-popup-content {
      font-size: 14px;
      line-height: 1.5;
      max-width: 260px;
    }
    .note {
      padding: 12px 20px;
      background: #ecfeff;
      border-top: 1px solid #bae6fd;
      color: #155e75;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>SIPETRA Janti</h1>
    <p>Sistem Informasi Pertanahan Desa Janti</p>
  </header>

  <section class="controls">
    <h2>Kontrol Layer</h2>

    <div class="control-group">
      <label><input type="radio" name="basemap" id="osmBase" checked> OpenStreetMap</label>
      <label><input type="radio" name="basemap" id="satelliteBase"> Citra Satelit</label>
    </div>

    <div class="control-group">
      <label><input type="checkbox" id="admLayerToggle" checked> Batas Administrasi</label>
      <label><input type="checkbox" id="wmsLayerToggle" checked> Penggunaan Lahan</label>
      <label><input type="checkbox" id="tanahLayerToggle" checked> Status Hak</label>
    </div>
  </section>

  <div class="note">
    File ini membaca GeoJSON dari file yang sejajar di repo GitHub: <b>Admin.geojson</b>, <b>Penggunaan Lahan.geojson</b>, dan <b>Status Hak.geojson</b>.
  </div>

  <main>
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([-7.694, 110.615], 16);

    const osmBase = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    });

    const satelliteBase = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { attribution: "Tiles &copy; Esri" }
    );

    osmBase.addTo(map);

    let admLayer;
    let penggunaanLahanLayer;
    let statusHakLayer;

    Promise.all([
      fetch("./Admin.geojson").then(res => res.json()),
      fetch("./Penggunaan Lahan.geojson").then(res => res.json()),
      fetch("./Status Hak.geojson").then(res => res.json())
    ])
    .then(([adminData, penggunaanData, statusData]) => {
      admLayer = L.geoJSON(adminData, {
        style: {
          color: "#e74c3c",
          weight: 3,
          fillOpacity: 0
        },
        onEachFeature: function(feature, layer) {
          layer.bindPopup(buildPopup("Batas Administrasi", feature.properties));
        }
      }).addTo(map);

      penggunaanLahanLayer = L.geoJSON(penggunaanData, {
        style: function(feature) {
          const kategori = getKategoriValue(feature).toLowerCase();
          return {
            color: getPenggunaanColor(kategori),
            weight: 1,
            fillColor: getPenggunaanColor(kategori),
            fillOpacity: 0.6
          };
        },
        onEachFeature: function(feature, layer) {
          layer.bindPopup(buildPopup("Penggunaan Lahan", feature.properties));
        }
      }).addTo(map);

      statusHakLayer = L.geoJSON(statusData, {
        style: function(feature) {
          const status = getStatusValue(feature).toLowerCase();
          return {
            color: getStatusBorderColor(status),
            weight: 1.5,
            fillColor: getStatusColor(status),
            fillOpacity: 0.75
          };
        },
        onEachFeature: function(feature, layer) {
          layer.bindPopup(buildPopup("Status Hak", feature.properties));
        }
      }).addTo(map);

      const allLayers = L.featureGroup([admLayer, penggunaanLahanLayer, statusHakLayer]);
      if (allLayers.getLayers().length > 0) {
        map.fitBounds(allLayers.getBounds());
      }
    })
    .catch(error => {
      console.error("Gagal memuat GeoJSON:", error);
      alert("GeoJSON gagal dimuat. Pastikan file Admin.geojson, Penggunaan Lahan.geojson, dan Status Hak.geojson ada di folder yang sama dengan file HTML ini.");
    });

    function buildPopup(title, properties) {
      let html = `<b>${title}</b><br>`;
      if (properties) {
        for (const key in properties) {
          html += `<b>${key}</b>: ${properties[key]}<br>`;
        }
      }
      return html;
    }

    function getKategoriValue(feature) {
      const p = feature.properties || {};
      return p.penggunaan || p.PENGGUNAAN || p.kategori || p.KATEGORI || p.nama || p.NAMA || "";
    }

    function getStatusValue(feature) {
      const p = feature.properties || {};
      return p.status || p.STATUS || p.hak || p.HAK || p.jenis_hak || p.JENIS_HAK || "";
    }

    function getStatusColor(status) {
      if (status.includes("hak milik")) return "#E8873A";
      if (status.includes("hak pakai")) return "#B5D44A";
      if (status.includes("hak wakaf")) return "#7A4E2D";
      if (status.includes("kosong")) return "#B0B0B0";
      if (status.includes("tidak ada data")) return "#2E2E2E";
      return "#999999";
    }

    function getStatusBorderColor(status) {
      if (status.includes("hak milik")) return "#c96b1f";
      if (status.includes("hak pakai")) return "#8aab1e";
      if (status.includes("hak wakaf")) return "#5a3418";
      if (status.includes("kosong")) return "#888888";
      if (status.includes("tidak ada data")) return "#111111";
      return "#666666";
    }

    function getPenggunaanColor(kategori) {
      if (kategori.includes("apotek")) return "#E8508C";
      if (kategori.includes("area parkir")) return "#3C5A28";
      if (kategori.includes("bangunan hunian")) return "#E88040";
      if (kategori.includes("gereja")) return "#C8C8C8";
      if (kategori.includes("jalan")) return "#E82020";
      if (kategori.includes("kantor pemerintahan")) return "#D8E898";
      if (kategori.includes("kolam")) return "#C8E8F8";
      if (kategori.includes("lapangan tidak diperkeras")) return "#B8D8A0";
      if (kategori.includes("masjid")) return "#286828";
      if (kategori.includes("pabrik")) return "#784878";
      if (kategori.includes("pekarangan")) return "#F8D8B8";
      if (kategori.includes("pemakaman")) return "#386838";
      if (kategori.includes("pendidikan dasar")) return "#F0A868";
      if (kategori.includes("lapangan diperkeras")) return "#D8D8B8";
      if (kategori.includes("rumah toko")) return "#F8E8C8";
      if (kategori.includes("sawah")) return "#70C840";
      if (kategori.includes("semak belukar")) return "#A8D870";
      if (kategori.includes("sungai")) return "#6898E8";
      if (kategori.includes("tempat hiburan")) return "#8858C8";
      if (kategori.includes("tempat penimbunan")) return "#C8A870";
      return "#cccccc";
    }

    document.getElementById("admLayerToggle").addEventListener("change", function() {
      if (!admLayer) return;
      this.checked ? map.addLayer(admLayer) : map.removeLayer(admLayer);
    });

    document.getElementById("wmsLayerToggle").addEventListener("change", function() {
      if (!penggunaanLahanLayer) return;
      this.checked ? map.addLayer(penggunaanLahanLayer) : map.removeLayer(penggunaanLahanLayer);
    });

    document.getElementById("tanahLayerToggle").addEventListener("change", function() {
      if (!statusHakLayer) return;
      this.checked ? map.addLayer(statusHakLayer) : map.removeLayer(statusHakLayer);
    });

    document.getElementById("osmBase").addEventListener("change", function() {
      if (this.checked) {
        if (map.hasLayer(satelliteBase)) map.removeLayer(satelliteBase);
        if (!map.hasLayer(osmBase)) map.addLayer(osmBase);
      }
    });

    document.getElementById("satelliteBase").addEventListener("change", function() {
      if (this.checked) {
        if (map.hasLayer(osmBase)) map.removeLayer(osmBase);
        if (!map.hasLayer(satelliteBase)) map.addLayer(satelliteBase);
      }
    });
  </script>
</body>
</html>

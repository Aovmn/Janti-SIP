<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPETRA Janti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #fbf8f3;
      --surface: #ffffff;
      --text: #231c17;
      --muted: #6b5a4e;
      --line: rgba(46,36,29,.08);
      --primary: #8b5e3c;
      --primary-deep: #4c2f1d;
      --shadow: 0 8px 30px rgba(0,0,0,0.06);
      --radius: 16px;
      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-display: 'Cormorant Garamond', Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); color: var(--text); background: var(--bg); line-height: 1.5; padding: 24px; }
    
    .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #6f4a2f, #8b5e3c); font-weight: 700; }
    .brand h1 { font-family: var(--font-display); font-size: 28px; color: var(--primary-deep); }
    
    .grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; min-height: 650px; }
    
    .sidebar { background: var(--surface); border-radius: var(--radius); padding: 24px; border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 24px; }
    .sidebar-section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 12px; }
    
    .control-group { display: flex; flex-direction: column; gap: 12px; }
    .control-item { display: flex; flex-direction: column; gap: 6px; padding: 12px; background: #faf8f5; border: 1px solid var(--line); border-radius: 10px; }
    .control-label { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
    
    /* Slider Transparansi */
    .opacity-slider-container { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(0,0,0,0.05); }
    .opacity-slider-container span { font-size: 11px; color: var(--muted); min-width: 30px; }
    .opacity-slider { flex: 1; accent-color: var(--primary); cursor: pointer; height: 4px; }

    #map { background: #eee; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); height: 100%; min-height: 650px; }
    
    /* Custom Popup Styles */
    .custom-popup .leaflet-popup-content-wrapper { border-radius: 14px; background: #fffaf4; border: 1px solid rgba(197,154,74,0.3); padding: 0; overflow: hidden; width: 280px; }
    .custom-popup .leaflet-popup-tip { background: #fffaf4; }
    .leaflet-popup-content { margin: 0 !important; width: 100% !important; }
    .popup-card { padding: 16px; }
    .popup-title { font-weight: 700; font-size: 16px; color: var(--primary-deep); font-family: var(--font-display); margin-bottom: 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    .popup-section { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(46,36,29,0.1); }
    .popup-section:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
    .popup-section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .popup-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; padding: 2px 0; }
    .popup-key { font-size: 11px; color: var(--muted); }
    .popup-value { font-size: 13px; font-weight: 600; color: var(--text); }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <h1>SIPETRA Janti</h1>
          <p style="font-size: 12px; color: var(--muted)">Sistem Informasi Pertanahan Desa</p>
        </div>
      </div>
    </header>

    <div class="grid">
      <aside class="sidebar">
        <div class="sidebar-section">
          <h2>Basemap</h2>
          <div class="control-group">
            <label class="control-label"><input type="radio" name="basemap" id="osmBase" checked> OpenStreetMap</label>
            <label class="control-label"><input type="radio" name="basemap" id="satelliteBase"> Citra Satelit</label>
          </div>
        </div>

        <div class="sidebar-section">
          <h2>Layer Utama & Transparansi</h2>
          <div class="control-group">
            
            <!-- Pengaturan Administrasi -->
            <div class="control-item">
              <label class="control-label"><input type="checkbox" id="admLayerToggle" checked> Batas Administrasi</label>
            </div>

            <!-- Pengaturan Penggunaan Lahan -->
            <div class="control-item">
              <label class="control-label"><input type="checkbox" id="wmsLayerToggle" checked> Penggunaan Lahan</label>
              <div class="opacity-slider-container">
                <span>Trans:</span>
                <input type="range" id="wmsOpacity" class="opacity-slider" min="0" max="1" step="0.1" value="0.85">
              </div>
            </div>

            <!-- Pengaturan Status Hak -->
            <div class="control-item">
              <label class="control-label"><input type="checkbox" id="tanahLayerToggle" checked> Status Hak Tanah</label>
              <div class="opacity-slider-container">
                <span>Trans:</span>
                <input type="range" id="tanahOpacity" class="opacity-slider" min="0" max="1" step="0.1" value="0.7">
              </div>
            </div>

          </div>
        </div>
      </aside>

      <main id="map"></main>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-7.694, 110.615], 16);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);
    const satelliteBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });

    let admLayer, penggunaanLahanLayer, statusHakLayer;
    let penggunaanFeatures = [], statusFeatures = [], zntFeatures = [], admFeatures = [];

    // Nilai Default Opacity Cerah
    let opacityLahan = 0.85;
    let opacityStatus = 0.70;

    // Palet warna cerah kontras tinggi dengan garis tepi putih (#ffffff)
    function getPenggunaanColor(kat) {
      if (kat.includes('sawah')) return '#66FF00';      // Hijau Neon Sawah
      if (kat.includes('bangunan') || kat.includes('hunian')) return '#FF3300'; // Merah Cerah Rumah
      if (kat.includes('pekarangan')) return '#FFCC00';   // Kuning Pekarangan
      if (kat.includes('jalan')) return '#D1D1D1';        // Abu Terang Jalan
      if (kat.includes('sungai') || kat.includes('kolam')) return '#00CCFF'; // Biru Cyan Air
      if (kat.includes('masjid') || kat.includes('gereja')) return '#FF00CC'; // Pink Fasum/Ibadah
      return '#BFA38A';
    }

    function getStatusColor(st) {
      if (st.includes('milik')) return '#FFEB3B'; // Kuning Emas Cerah
      if (st.includes('pakai')) return '#00E676'; // Hijau Cerah Lembut
      if (st.includes('wakaf')) return '#FF9100'; // Oranye Terang
      return '#CFD8DC';
    }

    function findFeatureAtLatLng(latlng, features) {
      for (const f of features) {
        try {
          const layer = L.geoJSON(f);
          if (layer.getBounds().contains(latlng)) return f.properties;
        } catch(e){}
      }
      return null;
    }

    function buildUnifiedPopup(latlng, clickedProps) {
      const pLahan = findFeatureAtLatLng(latlng, penggunaanFeatures) || {};
      const pStatus = findFeatureAtLatLng(latlng, statusFeatures) || {};
      const pZNT = findFeatureAtLatLng(latlng, zntFeatures) || {};
      const pAdm = findFeatureAtLatLng(latlng, admFeatures) || {};

      const desa = pAdm.NAMOBJ || pAdm.DESA || clickedProps.DESA || 'Janti';
      const lahanVal = clickedProps.V4_JB || clickedProps.penggunaan || pLahan.V4_JB || pLahan.penggunaan || '–';
      const statusVal = clickedProps.tipe_hak || clickedProps.status || pStatus.tipe_hak || pStatus.status || '–';
      const zntVal = pZNT.ZNT || pZNT.znt || clickedProps.ZNT || '–';
      const nilaiVal = pZNT.nilai_tanah || pZNT.NJOP || clickedProps.nilai_tanah || null;

      return `
        <div class="popup-card">
          <div class="popup-title">Informasi Bidang</div>
          <div class="popup-section">
            <div class="popup-section-title">📍 Lokasi</div>
            <div class="popup-row"><div class="popup-key">Desa</div><div class="popup-value">${desa}</div></div>
          </div>
          <div class="popup-section">
            <div class="popup-section-title">🌾 Penggunaan & Hak</div>
            <div class="popup-row"><div class="popup-key">Pemanfaatan</div><div class="popup-value">${lahanVal}</div></div>
            <div class="popup-row"><div class="popup-key">Status Hak</div><div class="popup-value">${statusVal}</div></div>
          </div>
          <div class="popup-section">
            <div class="popup-section-title">🏷️ Info ZNT (Tersembunyi)</div>
            <div class="popup-row"><div class="popup-key">Kode Zona</div><div class="popup-value">${zntVal}</div></div>
            ${nilaiVal ? `<div class="popup-row"><div class="popup-key">Nilai Tanah</div><div class="popup-value">Rp ${Number(nilaiVal).toLocaleString('id-ID')}/m²</div></div>` : ''}
          </div>
        </div>`;
    }

    function setupClick(feature, layer) {
      layer.on('click', function(e) {
        L.DomEvent.stopPropagation(e);
        const content = buildUnifiedPopup(e.latlng, feature.properties || {});
        L.popup({ className: 'custom-popup', maxWidth: 280 }).setLatLng(e.latlng).setContent(content).openOn(map);
      });
    }

    // Ajax Loader Data GeoJSON
    Promise.all([
      fetch('./Batas Administrasi.geojson').then(r => r.json()),
      fetch('./Penggunaan Lahan.geojson').then(r => r.json()),
      fetch('./Status Hak.geojson').then(r => r.json()),
      fetch('./ZNT.geojson').then(r => r.json()).catch(() => ({ features: [] }))
    ])
    .then(([adminData, penggunaanData, statusData, zntData]) => {
      admFeatures = adminData.features || [];
      penggunaanFeatures = penggunaanData.features || [];
      statusFeatures = statusData.features || [];
      zntFeatures = zntData.features || [];

      // 1. Layer Batas Admin (Paling bawah dasar)
      admLayer = L.geoJSON(adminData, {
        style: { color: '#e60000', weight: 3, fillOpacity: 0, dashArray: '6, 4' },
        onEachFeature: setupClick
      }).addTo(map);

      // 2. Layer Status Hak Tanah
      statusHakLayer = L.geoJSON(statusData, {
        style: (f) => {
          const st = (f.properties.tipe_hak || f.properties.status || '').toLowerCase();
          return { color: '#ffffff', weight: 0.8, fillColor: getStatusColor(st), fillOpacity: opacityStatus };
        },
        onEachFeature: setupClick
      }).addTo(map);

      // 3. Layer Penggunaan Lahan (Dinaikkan ke paling atas)
      penggunaanLahanLayer = L.geoJSON(penggunaanData, {
        style: (f) => {
          const kat = (f.properties.V4_JB || f.properties.penggunaan || '').toLowerCase();
          return { color: '#ffffff', weight: 0.6, fillColor: getPenggunaanColor(kat), fillOpacity: opacityLahan };
        },
        onEachFeature: setupClick
      }).addTo(map);

      // Memaksa layer penggunaan lahan berada di atas status hak tanah secara mutlak
      penggunaanLahanLayer.bringToFront();

      const group = L.featureGroup([penggunaanLahanLayer, statusHakLayer].filter(l => l !== undefined));
      if (group.getLayers().length > 0) map.fitBounds(group.getBounds());
    })
    .catch(err => console.error("Ada kendala pembacaan file spasial:", err));

    // Event Handler untuk Switch On/Off Layer
    document.getElementById('admLayerToggle').addEventListener('change', function() { if(admLayer) this.checked ? map.addLayer(admLayer) : map.removeLayer(admLayer); });
    document.getElementById('wmsLayerToggle').addEventListener('change', function() { 
      if(penggunaanLahanLayer) {
        if(this.checked) {
          map.addLayer(penggunaanLahanLayer);
          penggunaanLahanLayer.bringToFront();
        } else {
          map.removeLayer(penggunaanLahanLayer);
        }
      }
    });
    document.getElementById('tanahLayerToggle').addEventListener('change', function() { 
      if(statusHakLayer) {
        this.checked ? map.addLayer(statusHakLayer) : map.removeLayer(statusHakLayer);
        if(penggunaanLahanLayer && map.hasLayer(penggunaanLahanLayer)) penggunaanLahanLayer.bringToFront();
      }
    });
    
    // Event Handler Pengatur Transparansi (Slider)
    document.getElementById('wmsOpacity').addEventListener('input', function() {
      opacityLahan = parseFloat(this.value);
      if (penggunaanLahanLayer) {
        penggunaanLahanLayer.setStyle({ fillOpacity: opacityLahan });
      }
    });

    document.getElementById('tanahOpacity').addEventListener('input', function() {
      opacityStatus = parseFloat(this.value);
      if (statusHakLayer) {
        statusHakLayer.setStyle({ fillOpacity: opacityStatus });
      }
    });

    // Switch Basemap
    document.getElementById('osmBase').addEventListener('change', function() { if(this.checked) { map.removeLayer(satelliteBase); map.addLayer(osmBase); if(penggunaanLahanLayer) penggunaanLahanLayer.bringToFront(); } });
    document.getElementById('satelliteBase').addEventListener('change', function() { if(this.checked) { map.removeLayer(osmBase); map.addLayer(satelliteBase); if(penggunaanLahanLayer) penggunaanLahanLayer.bringToFront(); } });
  </script>
</body>
</html>
